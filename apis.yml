apis:
- name: Forta Health Clinical Operations API
  description: >-
    The private REST API behind the Forta Health clinical operations platform (app.fortahealth.com), a
    FastAPI service exposing 450 operations across 306 paths covering providers and provider assignments,
    clients and client assessments, therapy sessions with trial/duration/rate event capture, clinical QA
    reviews, treatment plans and statuses, BCBA and parent supervisions, cohorts, facilities, payors and
    payor-provider credentials, claims and claim invoices, service codes, timesheets, electronic visit
    verification (EVV), intake and onboarding questionnaires, assessment surveys, policies, feature flags
    and Stripe billing. Authentication is HTTP bearer; every operation except the health check is
    authenticated. This is an internal product API with no public developer program, no published
    documentation and no self-serve signup — the OpenAPI description is served publicly at the API host
    root, which is how it was discovered.
  humanURL: https://app.fortahealth.com/
  baseURL: https://api.prod.fortahealth.com/api/v1/
