aid: forta-health
name: Forta Health
description: >-
  Forta Health operates the largest virtual Applied Behavior Analysis (ABA) network in the United States,
  delivering autism therapy to children through two models: Virtual ABA over a HIPAA-secure telehealth
  platform across 43 states, and In-Home ABA in Dallas, Houston and San Antonio, Texas. Founded in 2021 and
  led by CEO Edan Morag, Forta pairs Board Certified Behavior Analysts (BCBAs) who design and supervise
  individualized treatment plans with Registered Behavior Technicians (RBTs) and trained parents who deliver
  live sessions, using proprietary software and machine-learning models that ingest medical records and
  session data to surface relevant case data for clinicians and personalize each treatment plan. The company
  works with major commercial payers and state Medicaid programs to shorten the typical six-to-eighteen-month
  ABA waitlist to roughly ninety days. Forta publishes no public developer program; its clinical operations
  platform is a private, bearer-token-authenticated REST API.
