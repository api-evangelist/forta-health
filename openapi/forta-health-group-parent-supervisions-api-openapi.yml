components:
  schemas:
    LocationEnumV2:
      type: string
      enum:
      - Home
      - Community settings
      title: LocationEnumV2
    LinkedClaimResponse:
      properties:
        id:
          type: integer
          title: Id
        status:
          $ref: '#/components/schemas/ClaimStatusEnum'
        secondary_status:
          anyOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          - type: 'null'
        total_charge:
          type: number
          minimum: 0.0
          title: Total Charge
        clearing_house_claim_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Clearing House Claim Id
      type: object
      required:
      - id
      - status
      - total_charge
      title: LinkedClaimResponse
    GroupParentSupervisionBackdate:
      properties:
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          title: Utc Offset Date Start
      type: object
      required:
      - date_start
      - utc_offset_date_start
      title: GroupParentSupervisionBackdate
    GroupParentSupervisionResponse:
      properties:
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          title: Utc Offset Date Start
        duration:
          type: integer
          title: Duration
        setting:
          $ref: '#/components/schemas/SettingEnumV2'
        id:
          type: integer
          title: Id
        bcba:
          $ref: '#/components/schemas/ProviderListResponse'
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_billable:
          type: boolean
          title: Is Billable
      type: object
      required:
      - date_start
      - utc_offset_date_start
      - duration
      - setting
      - id
      - bcba
      - status
      - is_billable
      title: GroupParentSupervisionResponse
    StatusEnum:
      type: string
      enum:
      - STARTED
      - COMPLETED
      - EDITING
      title: StatusEnum
    ClinicalStatusEnum:
      type: string
      enum:
      - PRE CLINICAL
      - CLINICAL
      - ON HOLD
      - OFFBOARDED
      - LIMITED ACCESS GUARDIAN
      title: ClinicalStatusEnum
    TrainingTopicResponse:
      properties:
        description:
          type: string
          minLength: 120
          title: Description
        label:
          type: string
          minLength: 2
          title: Label
        id:
          type: integer
          title: Id
        group_parent_supervision_id:
          type: integer
          title: Group Parent Supervision Id
      type: object
      required:
      - description
      - label
      - id
      - group_parent_supervision_id
      title: TrainingTopicResponse
    ProviderListResponseForGPSN:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
          format: email
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - id
      - name
      - email
      title: ProviderListResponseForGPSN
    FamilyTrainingTopicResponse:
