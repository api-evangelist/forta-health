openapi: 3.2.0
info:
  title: Fast Treatment Plans V3 API
  version: 0.1.0
tags:
- name: treatment_plans_v3
paths:
  /api/v2/treatment_plans/:
    post:
      tags:
      - treatment_plans_v3
      summary: Create Treatment Plan
      description: 'Create a version 3 plan: blank, from an intake questionnaire, or a clone.'
      operationId: create_treatment_plan_api_v2_treatment_plans__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentPlanV3Create'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - _ForbiddenOnMissingCredentials: []
  /api/v2/treatment_plans/{treatment_plan_id}/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Treatment Plan By Id
      operationId: read_treatment_plan_by_id_api_v2_treatment_plans__treatment_plan_id___get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentPlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Page Statuses
      description: 'One status per page, in navigation bar order: empty, completed, or error.'
      operationId: read_page_statuses_api_v2_treatment_plans__treatment_plan_id__pages__get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageStatusResponse'
                title: Response Read Page Statuses Api V2 Treatment Plans  Treatment Plan Id  Pages  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/information/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Information Page
      operationId: read_information_page_api_v2_treatment_plans__treatment_plan_id__pages_information__get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentPlanV3InformationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medical/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Medical Page
      operationId: read_medical_page_api_v2_treatment_plans__treatment_plan_id__pages_medical__get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - treatment_plans_v3
      summary: Patch Medical Info
      operationId: patch_medical_info_api_v2_treatment_plans__treatment_plan_id__pages_medical__patch
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allergies:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 255
                  - type: 'null'
                  title: Allergies
                special_diets:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 255
                  - type: 'null'
                  title: Special Diets
                hearing_difficulty:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalHearingDifficultyEnum'
                  - type: 'null'
                hearing_screening_date:
                  anyOf:
                  - type: string
                    format: date
                  - type: 'null'
                  title: Hearing Screening Date
                vision_difficulty:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalVisionDifficultyEnum'
                  - type: 'null'
                vision_screening_date:
                  anyOf:
                  - type: string
                    format: date
                  - type: 'null'
                  title: Vision Screening Date
                trauma_history:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 50000
                  - type: 'null'
                  title: Trauma History
                hospitalization_history:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 50000
                  - type: 'null'
                  title: Hospitalization History
                asd_severity_level:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalAsdSeverityEnum'
                  - type: 'null'
                asd_diagnosis_provider_name:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Asd Diagnosis Provider Name
                asd_diagnosis_city:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 255
                  - type: 'null'
                  title: Asd Diagnosis City
                asd_diagnosis_state:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 2
                  - type: 'null'
                  title: Asd Diagnosis State
                asd_diagnosis_year:
                  anyOf:
                  - type: integer
                    maximum: 2100
                    minimum: 1900
                  - type: 'null'
                  title: Asd Diagnosis Year
                child_delivery_type:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalChildDeliveryTypeEnum'
                  - type: 'null'
                child_gestational_age_weeks:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Gestational Age Weeks
                child_weight_at_birth_pounds:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Weight At Birth Pounds
                child_weight_at_birth_ounces:
                  anyOf:
                  - type: integer
                    maximum: 15
                    minimum: 0
                  - type: 'null'
                  title: Child Weight At Birth Ounces
                child_sitting_up_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Sitting Up Age Months
                child_crawling_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Crawling Age Months
                child_walking_age_years:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Walking Age Years
                child_walking_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Walking Age Months
                child_standing_age_years:
                  anyOf:
                  - type: integer
                    maximum: 9
                    minimum: 0
                  - type: 'null'
                  title: Child Standing Age Years
                child_standing_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Standing Age Months
                child_babbling_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child Babbling Age Months
                child_first_word:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 16
                    pattern: ^\S+$
                  - type: 'null'
                  title: Child First Word
                child_second_word:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 16
                    pattern: ^\S+$
                  - type: 'null'
                  title: Child Second Word
                child_first_words_age_months:
                  anyOf:
                  - type: integer
                    maximum: 99
                    minimum: 0
                  - type: 'null'
                  title: Child First Words Age Months
              title: Body
              description: Partial PATCH of the main Medical record. ``null`` clears a field.
              additionalProperties: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MedicalInfoResponse'
                - type: 'null'
                title: Response Patch Medical Info Api V2 Treatment Plans  Treatment Plan Id  Pages Medical  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medical/diagnoses/:
    post:
      tags:
      - treatment_plans_v3
      summary: Create Medical Diagnosis
      operationId: create_medical_diagnosis_api_v2_treatment_plans__treatment_plan_id__pages_medical_diagnoses__post
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnosis_name:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalDiagnosisEnum'
                  - type: 'null'
                provider_name:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Provider Name
                city:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 255
                  - type: 'null'
                  title: City
                state:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 2
                  - type: 'null'
                  title: State
                year:
                  anyOf:
                  - type: integer
                    maximum: 2100
                    minimum: 1900
                  - type: 'null'
                  title: Year
              title: Body
              description: Body of POST and PATCH for one additional diagnosis row.
              additionalProperties: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalDiagnosisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medical/diagnoses/{diagnosis_id}/:
    patch:
      tags:
      - treatment_plans_v3
      summary: Patch Medical Diagnosis
      operationId: patch_medical_diagnosis_api_v2_treatment_plans__treatment_plan_id__pages_medical_diagnoses__diagnosis_id___patch
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: diagnosis_id
        in: path
        required: true
        schema:
          type: integer
          title: Diagnosis Id
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnosis_name:
                  anyOf:
                  - $ref: '#/components/schemas/MedicalDiagnosisEnum'
                  - type: 'null'
                provider_name:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Provider Name
                city:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 255
                  - type: 'null'
                  title: City
                state:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 2
                  - type: 'null'
                  title: State
                year:
                  anyOf:
                  - type: integer
                    maximum: 2100
                    minimum: 1900
                  - type: 'null'
                  title: Year
              title: Body
              description: Body of POST and PATCH for one additional diagnosis row.
              additionalProperties: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalDiagnosisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - treatment_plans_v3
      summary: Delete Medical Diagnosis
      operationId: delete_medical_diagnosis_api_v2_treatment_plans__treatment_plan_id__pages_medical_diagnoses__diagnosis_id___delete
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: diagnosis_id
        in: path
        required: true
        schema:
          type: integer
          title: Diagnosis Id
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medical/selections/:
    post:
      tags:
      - treatment_plans_v3
      summary: Create Medical Selection
      operationId: create_medical_selection_api_v2_treatment_plans__treatment_plan_id__pages_medical_selections__post
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selection_type:
                  $ref: '#/components/schemas/MedicalSelectionTypeEnum'
                value:
                  type: string
                  title: Value
              required:
              - selection_type
              - value
              title: Body
              additionalProperties: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalSelectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medical/selections/{selection_type}/{selection_id}/:
    delete:
      tags:
      - treatment_plans_v3
      summary: Delete Medical Selection
      operationId: delete_medical_selection_api_v2_treatment_plans__treatment_plan_id__pages_medical_selections__selection_type___selection_id___delete
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: selection_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MedicalSelectionTypeEnum'
      - name: selection_id
        in: path
        required: true
        schema:
          type: integer
          title: Selection Id
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medications/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Medication Page
      operationId: read_medication_page_api_v2_treatment_plans__treatment_plan_id__pages_medications__get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - treatment_plans_v3
      summary: Update Medication Flag
      description: Set the checkbox. ``true`` returns 409 while medications exist.
      operationId: update_medication_flag_api_v2_treatment_plans__treatment_plan_id__pages_medications__patch
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                no_medication:
                  type: boolean
                  title: No Medication
              required:
              - no_medication
              title: Request
              description: 'Body of ``PATCH /pages/medications/``.


                ``no_medication`` is the checkbox "No medication taken by the client".'
              additionalProperties: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - treatment_plans_v3
      summary: Create Medication
      description: Add a medication. Returns 409 while the checkbox is on.
      operationId: create_medication_api_v2_treatment_plans__treatment_plan_id__pages_medications__post
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                medication_name:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 255
                  - type: 'null'
                  title: Medication Name
                dosage:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 255
                  - type: 'null'
                  title: Dosage
                start_date:
                  anyOf:
                  - type: string
                    format: date
                  - type: 'null'
                  title: Start Date
                physician_name:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Physician Name
                reason:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Reason
              title: Request
              description: Create body. Every field is optional. At least one field is required.
              additionalProperties: false
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__api__schemas__treatment_plans__v3__medication__MedicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medications/all/:
    delete:
      tags:
      - treatment_plans_v3
      summary: Delete All Medications
      operationId: delete_all_medications_api_v2_treatment_plans__treatment_plan_id__pages_medications_all__delete
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/medications/{medication_id}/:
    patch:
      tags:
      - treatment_plans_v3
      summary: Update Medication
      operationId: update_medication_api_v2_treatment_plans__treatment_plan_id__pages_medications__medication_id___patch
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Medication Id
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                medication_name:
                  anyOf:
                  - type: string
                    minLength: 4
                    maxLength: 255
                  - type: 'null'
                  title: Medication Name
                dosage:
                  anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 255
                  - type: 'null'
                  title: Dosage
                start_date:
                  anyOf:
                  - type: string
                    format: date
                  - type: 'null'
                  title: Start Date
                physician_name:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Physician Name
                reason:
                  anyOf:
                  - type: string
                    minLength: 8
                    maxLength: 255
                  - type: 'null'
                  title: Reason
              title: Request
              description: Partial update. Only the fields in the body change. ``null`` clears a field.
              additionalProperties: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__api__schemas__treatment_plans__v3__medication__MedicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - treatment_plans_v3
      summary: Delete Medication
      operationId: delete_medication_api_v2_treatment_plans__treatment_plan_id__pages_medications__medication_id___delete
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Medication Id
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/treatment_plans/{treatment_plan_id}/pages/therapy/:
    get:
      tags:
      - treatment_plans_v3
      summary: Read Therapy Page
      operationId: read_therapy_page_api_v2_treatment_plans__treatment_plan_id__pages_therapy__get
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - treatment_plans_v3
      summary: Update Therapy Flag
      description: Set the checkbox. ``true`` deletes every historical therapy.
      operationId: update_therapy_flag_api_v2_treatment_plans__treatment_plan_id__pages_therapy__patch
      security:
      - _ForbiddenOnMissingCredentials: []
      parameters:
      - name: treatment_plan_id
        in: path
        required: true
        schema:
          type: integer
          title: Treatment Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                no_historical_therapy:
                  type: boolean
                  title: No Historical Therapy
              required:
              - no_historical_therapy
              title: Request
              description: Body of ``PATCH /pages/therapy/``.
              additionalProperties: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyPageResponse'
