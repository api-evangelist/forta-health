openapi: 3.2.0
info:
  title: Fast Feature Flags API
  version: 0.1.0
tags:
- name: feature_flags
paths:
  /api/v1/feature_flags/:
    get:
      tags:
      - feature_flags
      summary: Get Feature Flags
      operationId: get_feature_flags_api_v1_feature_flags__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Get Feature Flags Api V1 Feature Flags  Get
      security:
      - HTTPBearer: []
  /api/v1/feature_flags/{key}:
    put:
      tags:
      - feature_flags
      summary: Set Feature Flag
      operationId: set_feature_flag_api_v1_feature_flags__key__put
      security:
      - HTTPBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FeatureFlagUpdate:
      properties:
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - enabled
      title: FeatureFlagUpdate
    FeatureFlagResponse:
      properties:
        key:
          type: string
          title: Key
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - key
      - enabled
      title: FeatureFlagResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
