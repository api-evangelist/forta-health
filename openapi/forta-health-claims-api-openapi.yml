openapi: 3.2.0
info:
  title: Fast Claims API
  version: 0.1.0
tags:
- name: claims
paths:
  /api/v1/claims/preview/:
    post:
      tags:
      - claims
      summary: Generate Form 1500 Preview
      operationId: generate_form_1500_preview_api_v1_claims_preview__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPreview'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1500Data'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/claims/:
    post:
      tags:
      - claims
      summary: Create Claim
      operationId: create_claim_api_v1_claims__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - claims
      summary: Get Claims
      operationId: get_claims_api_v1_claims__get
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Claim Id
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Session Id
      - name: client_supervision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Supervision Id
      - name: parent_supervision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Supervision Id
      - name: client_assessment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Assessment Id
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
      - name: biller_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Biller Id
      - name: payor_claim_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Payor Claim Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: secondary_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Secondary Status
      - name: date_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Start
      - name: date_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date End
      - name: clearing_house_claim_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Clearing House Claim Id
      - name: invoice_history_attributes_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Invoice History Attributes Only
      - name: invoiceable_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Invoiceable Only
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: array
                items:
                  type: integer
              - type: 'null'
              title: Claim Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/ClaimListResponse'
                  - $ref: '#/components/schemas/ClaimWithInvoiceHistoryResponse'
                title: Response Get Claims Api V1 Claims  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/{claim_id}/resubmit/:
    post:
      tags:
      - claims
      summary: Resubmit Claim
      operationId: resubmit_claim_api_v1_claims__claim_id__resubmit__post
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimResubmit'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/{claim_id}/:
    get:
      tags:
      - claims
      summary: Get Claim
      operationId: get_claim_api_v1_claims__claim_id___get
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - claims
      summary: Delete Claim
      operationId: delete_claim_api_v1_claims__claim_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - claims
      summary: Patch Claim
      operationId: patch_claim_api_v1_claims__claim_id___patch
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/admin/{claim_id}/:
    delete:
      tags:
      - claims
      summary: Admin Delete Claim
      description: 'Admin-only force delete: remove a claim in ANY status, no status guardrails.


        Unlike ``delete_claim``, this skips ``validate_delete_request`` (which limits

        deletion to Generated/Unbillable), so an admin can delete a claim regardless of

        status. It still refuses (409) when the claim has references the cascade cannot

        safely remove -- an invoice, child claims, or EOB documents -- surfacing a clear

        message via ``assert_admin_deletable`` rather than a raw FK error. Because the row

        is about to be removed, a warning-level audit line is emitted first, recording the

        acting admin and a snapshot of the claim''s key fields.'
      operationId: admin_delete_claim_api_v1_claims_admin__claim_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/admin/{claim_id}/status/:
    patch:
      tags:
      - claims
      summary: Admin Override Claim Status
      description: 'Admin-only override of the claim status and the payment status.


        This endpoint does not use the workflow validators. An admin can set

        the status of a claim in almost any state. Some guards stay: the

        endpoint refuses (409) a change that can break an invoice, a payment,

        an EOB file, or a second submission (see assert_admin_status_overridable).

        Each change writes a claim_status_change_log row and a warning log line.'
      operationId: admin_override_claim_status_api_v1_claims_admin__claim_id__status__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: integer
          title: Claim Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAdminStatusOverridePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/{claim_id}/follow_up_notes/:
    post:
      tags:
      - claims
      summary: Create Follow Up Notes
      operationId: create_follow_up_notes_api_v1_claims__claim_id__follow_up_notes__post
      security:
      - HTTPBearer: []
      parameters:
      - name: claim_id
        in: path
        required: true
