            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/claims/admin/bulk-unbillable:
    post:
      tags:
      - claims
      summary: Bulk Mark Notes Unbillable
      description: 'Admin-only: create Unbillable claims from a CSV of notes.


        Guarded by JWT + admin role. Returns a summary with a per-row failure CSV;

        never raises on individual bad rows.'
      operationId: bulk_mark_notes_unbillable_api_v1_claims_admin_bulk_unbillable_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_bulk_mark_notes_unbillable_api_v1_claims_admin_bulk_unbillable_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUnbillableSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    EOBDocumentResponse:
      properties:
        id:
          type: integer
          title: Id
        claim_id:
          type: integer
          title: Claim Id
        file_name:
          type: string
          title: File Name
        policy:
          $ref: '#/components/schemas/PolicyVitals'
        document_url:
          type: string
          title: Document Url
      type: object
      required:
      - id
      - claim_id
      - file_name
      - policy
      - document_url
      title: EOBDocumentResponse
    LinkedClaimResponse:
      properties:
        id:
          type: integer
          title: Id
        status:
          $ref: '#/components/schemas/ClaimStatusEnum'
        secondary_status:
          anyOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          - type: 'null'
        total_charge:
          type: number
          minimum: 0.0
          title: Total Charge
        clearing_house_claim_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Clearing House Claim Id
      type: object
      required:
      - id
      - status
      - total_charge
      title: LinkedClaimResponse
    ClaimPreview:
      properties:
        date_generated:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Generated
        utc_offset_date_generated:
          type: integer
          maximum: 50400.0
          minimum: -43200.0
          title: Utc Offset Date Generated
          description: Offset from UTC in seconds
          default: 0
        client_id:
          type: integer
          title: Client Id
        service_code_id:
          type: integer
          title: Service Code Id
        procedure_ids:
          items:
            type: integer
          type: array
          title: Procedure Ids
        skip_prior_authorization:
          type: boolean
          title: Skip Prior Authorization
        billing_facility_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Billing Facility Id
        use_custom_billing_facility:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Custom Billing Facility
          default: false
        relax_validations:
          type: boolean
          title: Relax Validations
          default: false
      type: object
      required:
      - client_id
      - service_code_id
      - procedure_ids
      - skip_prior_authorization
      title: ClaimPreview
    Form1500PayorInformation:
      properties:
        primary_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Id
      type: object
      title: Form1500PayorInformation
    EOBDocumentCreateResponse:
      properties:
        id:
          type: integer
          title: Id
        claim_id:
          type: integer
          title: Claim Id
        file_name:
          type: string
          title: File Name
        policy:
          $ref: '#/components/schemas/PolicyVitals'
        document_url:
          type: string
          title: Document Url
        presigned_url_upload:
          type: string
          title: Presigned Url Upload
      type: object
      required:
      - id
      - claim_id
      - file_name
      - policy
      - document_url
      - presigned_url_upload
      title: EOBDocumentCreateResponse
    JobTitleEnum:
      type: string
      enum:
      - Behavior Technician
      - Registered Behavior Technician
      - Behavior Technician Trainee
      - Virtual Therapy Assistant
      - Lead Virtual Therapy Assistant
      - Certified Behavioral Technician
      - BCBA
      - Lead BCBA
      - Clinical Director
      title: JobTitleEnum
    Form1500RenderingProvider:
      properties:
        npi:
          type: string
          minLength: 1
          title: Npi
