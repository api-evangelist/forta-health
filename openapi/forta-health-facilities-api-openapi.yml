          title: Tin
        npi:
          type: string
          title: Npi
        street_address_line_one:
          type: string
          title: Street Address Line One
        street_address_line_two:
          anyOf:
          - type: string
          - type: 'null'
          title: Street Address Line Two
        street_address_zip:
          type: string
          title: Street Address Zip
        street_address_city:
          type: string
          title: Street Address City
        street_address_state:
          type: string
          maxLength: 2
          minLength: 2
          title: Street Address State
        group_medicaid_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Medicaid Id
        id:
          type: integer
          title: Id
      type: object
      required:
      - label
      - tin
      - npi
      - street_address_line_one
      - street_address_zip
      - street_address_city
      - street_address_state
      - id
      title: FacilityResponse
    HTTPValidationError:
