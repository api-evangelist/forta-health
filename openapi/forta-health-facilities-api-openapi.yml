openapi: 3.2.0
info:
  title: Fast Facilities API
  version: 0.1.0
tags:
- name: Facilities
paths:
  /api/v1/facilities/:
    get:
      tags:
      - Facilities
      summary: Get Facilities
      operationId: get_facilities_api_v1_facilities__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FacilityResponse'
                type: array
                title: Response Get Facilities Api V1 Facilities  Get
      security:
      - _ForbiddenOnMissingCredentials: []
    post:
      tags:
      - Facilities
      summary: Create Facility
      operationId: create_facility_api_v1_facilities__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - _ForbiddenOnMissingCredentials: []
