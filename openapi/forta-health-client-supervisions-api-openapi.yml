openapi: 3.2.0
info:
  title: Fast Client Supervisions API
  version: 0.1.0
tags:
- name: client_supervisions
paths:
  /api/v1/client_supervisions/:
    post:
      tags:
      - client_supervisions
      summary: Create Client Supervision Notes
      operationId: create_client_supervision_notes_api_v1_client_supervisions__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSupervisionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - client_supervisions
      summary: Fetch Client Supervisions
      operationId: fetch_client_supervisions_api_v1_client_supervisions__get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      - name: status_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Status Id
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
      - name: action_required
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Action Required
      - name: client_clinical_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Client Clinical Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSupervisionListResponse'
                title: Response Fetch Client Supervisions Api V1 Client Supervisions  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/claim_history/:
    get:
      tags:
      - client_supervisions
      summary: Get Client Supervision Notes With Claim Status
      operationId: get_client_supervision_notes_with_claim_status_api_v1_client_supervisions_claim_history__get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: client_id
        in: query
        required: true
        schema:
          type: integer
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSupervisionListResponseWithClaimHistory'
                title: Response Get Client Supervision Notes With Claim Status Api V1 Client Supervisions
                  Claim History  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/:
    get:
      tags:
      - client_supervisions
      summary: Get Client Supervision Note
      operationId: get_client_supervision_note_api_v1_client_supervisions__client_supervision_id___get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionWithActiveGoalsResponseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - client_supervisions
      summary: Patch Client Supervision Notes
      operationId: patch_client_supervision_notes_api_v1_client_supervisions__client_supervision_id___patch
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSupervisionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - client_supervisions
      summary: Delete Client Supervision
      operationId: delete_client_supervision_api_v1_client_supervisions__client_supervision_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/target_phase/:
    post:
      tags:
      - client_supervisions
      summary: Create Client Supervision Notes Target Phase
      operationId: create_client_supervision_notes_target_phase_api_v1_client_supervisions__client_supervision_id__target_phase__post
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSupervisionNoteTargetPhaseCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionNoteTargetPhaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/target_phase/{target_phase_id}/:
    delete:
      tags:
      - client_supervisions
      summary: Delete Client Supervision Note Target Phase
      operationId: delete_client_supervision_note_target_phase_api_v1_client_supervisions__client_supervision_id__target_phase__target_phase_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      - name: target_phase_id
        in: path
        required: true
        schema:
          type: integer
          title: Target Phase Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSupervisionNoteTargetPhaseResponse'
                title: Response Delete Client Supervision Note Target Phase Api V1 Client Supervisions  Client
                  Supervision Id  Target Phase  Target Phase Id   Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/stop/:
    put:
      tags:
      - client_supervisions
      summary: Stop Client Supervision
      operationId: stop_client_supervision_api_v1_client_supervisions__client_supervision_id__stop__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      - name: x-forwarded-for
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Forwarded-For
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSupervisionStop'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/data/utilization/:
    get:
      tags:
      - client_supervisions
      summary: Get Utilization
      operationId: get_utilization_api_v1_client_supervisions_data_utilization__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: integer
          title: Client Id
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
          title: End
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionUtilizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/download/:
    get:
      tags:
      - client_supervisions
      summary: Download Client Supervision Pdf
      operationId: download_client_supervision_pdf_api_v1_client_supervisions__client_supervision_id__download__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSupervisionPdfResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/make_unbillable/:
    put:
      tags:
      - client_supervisions
      summary: Make Client Supervision Unbillable
      operationId: make_client_supervision_unbillable_api_v1_client_supervisions__client_supervision_id__make_unbillable__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/make_billable/:
    put:
      tags:
      - client_supervisions
      summary: Make Client Supervision Billable
      operationId: make_client_supervision_billable_api_v1_client_supervisions__client_supervision_id__make_billable__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/edit/:
    put:
      tags:
      - client_supervisions
      summary: Edit Client Supervision
      operationId: edit_client_supervision_api_v1_client_supervisions__client_supervision_id__edit__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/client_supervisions/{client_supervision_id}/backdate/:
    put:
      tags:
      - client_supervisions
      summary: Backdate Client Supervision
      operationId: backdate_client_supervision_api_v1_client_supervisions__client_supervision_id__backdate__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_supervision_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Supervision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSupervisionBackdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ClientSupervisionWithActiveGoalsResponseResponse:
      properties:
        id:
          type: integer
          title: Id
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          title: Utc Offset Date Start
        client:
          $ref: '#/components/schemas/ClientListResponse'
        duration:
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/ClientSupervisionDuration'
          title: Duration
        status:
          type: string
          title: Status
        bay:
          anyOf:
          - type: string
          - type: 'null'
          title: Bay
        bt_participants:
          $ref: '#/components/schemas/BTParticipantsResponse'
        client_id:
          type: integer
          title: Client Id
        location:
          anyOf:
          - $ref: '#/components/schemas/LocationEnumV1'
          - $ref: '#/components/schemas/LocationEnumV2'
          title: Location
        setting:
          anyOf:
          - $ref: '#/components/schemas/SettingEnumV1'
          - $ref: '#/components/schemas/SettingEnumV2'
          title: Setting
        participants_names:
          anyOf:
          - type: string
          - type: 'null'
          title: Participants Names
        participants:
          anyOf:
          - $ref: '#/components/schemas/ClientParticipants'
          - type: 'null'
        bcba:
          $ref: '#/components/schemas/ProviderListResponse'
        clinical_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Clinical Status
        response_to_treatment:
          anyOf:
          - type: string
          - type: 'null'
          title: Response To Treatment
        session_narrative:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Narrative
        overall_progress_toward_mastery:
          anyOf:
          - type: string
          - type: 'null'
          title: Overall Progress Toward Mastery
        modified_behaviour_intervention:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Behaviour Intervention
        assessed_modification:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessed Modification
        probed_new_skills:
          anyOf:
          - type: string
          - type: 'null'
          title: Probed New Skills
        reviewed_and_analyzed_data:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed And Analyzed Data
        reviewed_and_evaluated_session_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed And Evaluated Session Notes
        reviewed_and_evaluated_treatment_plan:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed And Evaluated Treatment Plan
        evaluated_progress:
          anyOf:
          - type: string
          - type: 'null'
          title: Evaluated Progress
        parent_demonstrated_new_or_changed_skills:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Demonstrated New Or Changed Skills
        target_phase:
          items:
            $ref: '#/components/schemas/ClientSupervisionNoteTargetPhaseResponse'
          type: array
          title: Target Phase
        active_treatment_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Treatment Id
        active_goals:
          anyOf:
          - items:
              $ref: '#/components/schemas/GoalResponse'
            type: array
          - type: 'null'
          title: Active Goals
      type: object
      required:
      - id
      - date_start
      - utc_offset_date_start
      - client
      - duration
      - status
      - bt_participants
      - client_id
      - location
      - setting
      - bcba
      - target_phase
      title: ClientSupervisionWithActiveGoalsResponseResponse
    LocationEnumV2:
      type: string
      enum:
      - Home
      - Community settings
      title: LocationEnumV2
    LinkedClaimResponse:
      properties:
        id:
          type: integer
          title: Id
        status:
          $ref: '#/components/schemas/ClaimStatusEnum'
        secondary_status:
          anyOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          - type: 'null'
        total_charge:
          type: number
          minimum: 0.0
          title: Total Charge
        clearing_house_claim_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Clearing House Claim Id
      type: object
      required:
      - id
      - status
      - total_charge
      title: LinkedClaimResponse
    TargetStageEnum:
      type: string
      enum:
      - Baseline
      - Mastered
      - On Hold
      - Discontinued
      - Acquisition
      - Generalization
      - Maintenance
      - In Progress
      title: TargetStageEnum
    JobTitleEnum:
      type: string
      enum:
      - Behavior Technician
      - Registered Behavior Technician
      - Behavior Technician Trainee
      - Virtual Therapy Assistant
      - Lead Virtual Therapy Assistant
      - Certified Behavioral Technician
      - BCBA
      - Lead BCBA
      - Clinical Director
      title: JobTitleEnum
    ClientSupervisionListResponseWithClaimHistory:
      properties:
        id:
          type: integer
          title: Id
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          title: Utc Offset Date Start
        duration:
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/ClientSupervisionDuration'
          title: Duration
        expected_duration:
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/ClientSupervisionDuration'
          title: Expected Duration
        status:
          type: string
          title: Status
        client:
          $ref: '#/components/schemas/ClientResponse'
        bcba:
          anyOf:
          - $ref: '#/components/schemas/ProviderResponse'
          - type: 'null'
        claim_history:
          items:
            $ref: '#/components/schemas/LinkedClaimResponse'
          type: array
          title: Claim History
        location:
          anyOf:
          - $ref: '#/components/schemas/LocationEnumV1'
          - $ref: '#/components/schemas/LocationEnumV2'
          title: Location
        bay:
          anyOf:
          - type: string
          - type: 'null'
          title: Bay
      type: object
      required:
      - id
      - date_start
      - utc_offset_date_start
      - duration
      - expected_duration
      - status
      - client
      - claim_history
      - location
      title: ClientSupervisionListResponseWithClaimHistory
    ClientSupervisionNoteTargetPhaseResponse:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        date_added:
          type: string
          format: date
          title: Date Added
        target_name:
          type: string
          title: Target Name
        goal_name:
          type: string
          title: Goal Name
      type: object
      required:
      - id
      - title
      - date_added
      - target_name
      - goal_name
      title: ClientSupervisionNoteTargetPhaseResponse
    BehaviorResponse:
      properties:
        label:
          type: string
          minLength: 2
          title: Label
        id:
          type: integer
          title: Id
      type: object
      required:
      - label
      - id
      title: BehaviorResponse
    HypothesizedFunctionResponse:
      properties:
        date_selected:
          type: string
          format: date
          title: Date Selected
        is_sensory:
          type: boolean
          title: Is Sensory
        is_escape_or_avoidance:
          type: boolean
          title: Is Escape Or Avoidance
        is_attention:
          type: boolean
          title: Is Attention
        is_tangible:
          type: boolean
          title: Is Tangible
        id:
          type: integer
          title: Id
        date_edits_blocked:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Edits Blocked
      type: object
      required:
      - date_selected
      - is_sensory
      - is_escape_or_avoidance
      - is_attention
      - is_tangible
      - id
      title: HypothesizedFunctionResponse
    InstancesMethodMasteryCriteriaResponse:
      properties:
        change_type:
          anyOf:
          - $ref: '#/components/schemas/MasteryCriteriaChangeTypeEnum'
          - type: 'null'
        desired_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Desired Amount
        practice_duration_count:
          anyOf:
          - type: integer
            exclusiveMaximum: 1000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Practice Duration Count
        practice_duration_unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Practice Duration Unit
      type: object
      required:
      - change_type
      - desired_amount
      - practice_duration_count
      title: InstancesMethodMasteryCriteriaResponse
    GoalResourceVersions:
      properties:
        baseline_measurement:
          type: string
          title: Baseline Measurement
      type: object
      required:
      - baseline_measurement
      title: GoalResourceVersions
    BTParticipantsRequest:
      properties:
        primary:
          anyOf:
          - type: integer
          - type: 'null'
          title: Primary
        secondary:
          items:
            type: integer
          type: array
          title: Secondary
      type: object
      required:
      - secondary
      title: BTParticipantsRequest
    ClinicalStatusEnum:
      type: string
      enum:
      - PRE CLINICAL
      - CLINICAL
      - ON HOLD
      - OFFBOARDED
      - LIMITED ACCESS GUARDIAN
      title: ClinicalStatusEnum
    DurationMethodMeasurementUnits:
      properties:
        duration_unit:
          $ref: '#/components/schemas/EventMeasurementUnitEnum'
        duration_unit_formatted:
          anyOf:
          - type: string
          - type: 'null'
          title: Duration Unit Formatted
      type: object
      required:
      - duration_unit
      title: DurationMethodMeasurementUnits
    GoalNameResponse:
      properties:
        label:
          type: string
          minLength: 2
          title: Label
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Prefix
        id:
          type: integer
          title: Id
        behavior_id:
          type: integer
          title: Behavior Id
        behavior:
          $ref: '#/components/schemas/BehaviorResponse'
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - label
      - id
      - behavior_id
      - behavior
      - is_active
      title: GoalNameResponse
    MasteryCriteriaChangeTypeEnum:
      type: string
      enum:
      - decrease
      - increase
      title: MasteryCriteriaChangeTypeEnum
    RateMethodMeasurementUnits:
      properties:
        interval_size:
          type: integer
          title: Interval Size
        interval_unit:
          $ref: '#/components/schemas/RateMethodMeasurementUnitsIntervalUnitEnum'
      type: object
      required:
      - interval_size
      - interval_unit
      title: RateMethodMeasurementUnits
    DurationMethodMasteryCriteriaResponse:
      properties:
        change_type:
          anyOf:
          - $ref: '#/components/schemas/MasteryCriteriaChangeTypeEnum'
          - type: 'null'
        desired_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Desired Amount
