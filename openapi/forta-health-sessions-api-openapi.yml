components:
  schemas:
    ClinicalQAReviewCreate:
      properties:
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          maximum: 50400.0
          minimum: -43200.0
          title: Utc Offset Date Start
          description: Offset from UTC in seconds
      type: object
      required:
      - date_start
      - utc_offset_date_start
      title: ClinicalQAReviewCreate
    SessionBackdate:
      properties:
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          title: Utc Offset Date Start
      type: object
      required:
      - date_start
      - utc_offset_date_start
      title: SessionBackdate
    UnacknowledgedSessionsResponse:
      properties:
        id:
          type: integer
          title: Id
        session_provider_id:
          type: integer
          title: Session Provider Id
      type: object
      required:
      - id
      - session_provider_id
      title: UnacknowledgedSessionsResponse
    ClinicalStatusEnum:
      type: string
      enum:
      - PRE CLINICAL
      - CLINICAL
      - ON HOLD
      - OFFBOARDED
      - LIMITED ACCESS GUARDIAN
      title: ClinicalStatusEnum
    ClinicalQAListResponse:
      properties:
        date_start:
          type: string
          format: date-time
          title: Date Start
        utc_offset_date_start:
          type: integer
          maximum: 50400.0
          minimum: -43200.0
          title: Utc Offset Date Start
          description: Offset from UTC in seconds
        id:
          type: integer
          title: Id
        verdict:
          $ref: '#/components/schemas/ClinicalQAReviewVerdict'
        status:
          $ref: '#/components/schemas/ClinicalQAReviewStatusEnum'
        date_reviewed:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Reviewed
        utc_offset_date_reviewed:
          anyOf:
          - type: integer
            maximum: 50400.0
            minimum: -43200.0
          - type: 'null'
          title: Utc Offset Date Reviewed
          description: Offset from UTC in seconds
        date_review_acknowledged:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Review Acknowledged
        utc_offset_date_review_acknowledged:
          anyOf:
          - type: integer
            maximum: 50400.0
            minimum: -43200.0
          - type: 'null'
          title: Utc Offset Date Review Acknowledged
          description: Offset from UTC in seconds
        has_submission_discourse_comments:
          type: boolean
          title: Has Submission Discourse Comments
        score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Score
      type: object
      required:
      - date_start
      - utc_offset_date_start
      - id
      - verdict
      - status
      - has_submission_discourse_comments
      - score
      title: ClinicalQAListResponse
    ProviderAssignmentClinicalRelationshipEnum:
      type: string
      enum:
      - home_bcba
      - bobbing_bcba
      - substitute_bcba
      - prbt
      - assistant_assessor
      - vbt
      - practicing_guardian
      - parent
      - caregiver
      - parent_and_caregiver
      - limited_access_guardian
      title: ProviderAssignmentClinicalRelationshipEnum
    app__api__schemas__sessions__trial__RateEventResponse:
      properties:
        date_of_event:
          type: string
          format: date-time
          title: Date Of Event
        id:
          type: integer
          title: Id
      type: object
      required:
      - date_of_event
      - id
      title: RateEventResponse
    EVVSessionStatusResponse:
      properties:
        start:
          $ref: '#/components/schemas/EVVSideStatusResponse'
        end:
          $ref: '#/components/schemas/EVVSideStatusResponse'
      type: object
      required:
      - start
      - end
      title: EVVSessionStatusResponse
    ClinicalQAReviewSubmit:
      properties:
        date_reviewed:
          type: string
          format: date-time
          title: Date Reviewed
        utc_offset_date_reviewed:
          type: integer
          maximum: 50400.0
          minimum: -43200.0
          title: Utc Offset Date Reviewed
          description: Offset from UTC in seconds
      type: object
      required:
      - date_reviewed
      - utc_offset_date_reviewed
      title: ClinicalQAReviewSubmit
    app__api__schemas__sessions__trial__TrialResponse:
      properties:
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attempts
        expected_response:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Response
        occurrence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Occurrence
        instances:
          anyOf:
          - items:
              $ref: '#/components/schemas/OccurrenceInstance'
            type: array
          - type: 'null'
          title: Instances
        id:
          type: integer
          title: Id
        target_id:
          type: integer
          title: Target Id
        rate_events:
          items:
            $ref: '#/components/schemas/app__api__schemas__sessions__trial__RateEventResponse'
          type: array
          title: Rate Events
          default: []
        duration_events:
          items:
            $ref: '#/components/schemas/app__api__schemas__sessions__trial__DurationEventResponse'
          type: array
          title: Duration Events
          default: []
        target:
          $ref: '#/components/schemas/TargetResponseWithGoal'
      type: object
      required:
      - id
      - target_id
      - target
      title: TrialResponse
    LocationEnumVersion2:
      type: string
      enum:
      - Home
      - Community settings
      title: LocationEnumVersion2
    GoalsAndTrialsResponse:
      additionalProperties:
        $ref: '#/components/schemas/GoalAndTrialsResponse'
      type: object
      title: GoalsAndTrialsResponse
    ClinicalQAReviewStatusEnum:
      type: string
      enum:
      - IN_PROGRESS
      - AWAITING_ACKNOWLEDGEMENT
      - ACKNOWLEDGED
      title: ClinicalQAReviewStatusEnum
    Bay:
      type: string
      enum:
      - BAY 1
      - BAY 2
      - BAY 2.5
      - BAY 2.6
      - BAY 2.7
      - BAY 3
      - BAY 6
      - BAY 7
      title: Bay
    SessionGoalTimingRequest:
      properties:
        timing_type:
          $ref: '#/components/schemas/SessionGoalTimingTypeEnum'
        start_offset_seconds:
          anyOf:
          - type: integer
