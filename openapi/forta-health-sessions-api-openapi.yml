openapi: 3.2.0
info:
  title: Fast Sessions API
  version: 0.1.0
tags:
- name: sessions
paths:
  /api/v1/sessions/:
    post:
      tags:
      - sessions
      summary: Create Session
      operationId: create_session_api_v1_sessions__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - sessions
      summary: Get Sessions
      operationId: get_sessions_api_v1_sessions__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      - name: include_qa_stats
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Qa Stats
      - name: bay
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Bay'
          - type: 'null'
          title: Bay
      - name: include_participated_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Participated Only
      - name: find_by_provider_id_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Find By Provider Id Only
      - name: action_required
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Action Required
      - name: client_clinical_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Client Clinical Status
      - name: pending_parent_signature
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Pending Parent Signature
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionListResponse'
                title: Response Get Sessions Api V1 Sessions  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/awaiting_guardian_signature/:
    get:
      tags:
      - sessions
      summary: Get Sessions Awaiting Guardian Signature
      operationId: get_sessions_awaiting_guardian_signature_api_v1_sessions_awaiting_guardian_signature__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionListResponse'
                type: array
                title: Response Get Sessions Awaiting Guardian Signature Api V1 Sessions Awaiting Guardian
                  Signature  Get
      security:
      - HTTPBearer: []
  /api/v1/sessions/bay7/guardian_signature/:
    post:
      tags:
      - sessions
      summary: Bay7 Guardian Signature
      operationId: bay7_guardian_signature_api_v1_sessions_bay7_guardian_signature__post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-forwarded-for
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Forwarded-For
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bay7GuardianSignatureRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/awaiting_acknowledgement/:
    get:
      tags:
      - sessions
      summary: Get Unacknowledged Sessions
      description: "Returns sessions of which most recent QA review is not acknowledged yet\nRoles Allowed:\
        \ pRBT, BCBA, Admin\nArgs:\n    provider:\nReturns:\n    list[SessionResponse]"
      operationId: get_unacknowledged_sessions_api_v1_sessions_awaiting_acknowledgement__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UnacknowledgedSessionsResponse'
                type: array
                title: Response Get Unacknowledged Sessions Api V1 Sessions Awaiting Acknowledgement  Get
      security:
      - HTTPBearer: []
  /api/v1/sessions/claim_history/:
    get:
      tags:
      - sessions
      summary: Get Sessions With Claim History
      description: "Roles Allowed: Clinical QA, Biller, Admin\nArgs:\n    client_id:\n    start:\n   \
        \ end:\n    include_qa_stats:\n    provider:\n    session_model_converter:\n    session_repo:\n\
        \    session_service:\n    clinical_qa_review_repo:\n\nReturns:\n    list[SessionResponseWithClaimStatus]"
      operationId: get_sessions_with_claim_history_api_v1_sessions_claim_history__get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
      - name: include_qa_stats
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Qa Stats
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Expand
      - name: bay
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Bay'
          - type: 'null'
          title: Bay
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionListResponseWithClaimHistory'
                title: Response Get Sessions With Claim History Api V1 Sessions Claim History  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/:
    get:
