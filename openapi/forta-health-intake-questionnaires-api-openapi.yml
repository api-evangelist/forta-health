      tags:
      - intake_questionnaires
      summary: Delete Intake Questionnaire Child Info Schedule
      description: 'Delete a child info schedule by id from an intake questionnaire.


        Only the provider the questionnaire was sent to may delete it (403 otherwise). 404 if

        the questionnaire does not exist, or if no schedule with ``schedule_id`` belongs to

        it. Once the questionnaire is COMPLETED no deletes are allowed (400).'
      operationId: delete_intake_questionnaire_child_info_schedule_api_v1_intake_questionnaires__questionnaire_id__child_info_schedule__schedule_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: questionnaire_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Intake questionnaire id (must be > 0)
          title: Questionnaire Id
        description: Intake questionnaire id (must be > 0)
      - name: schedule_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Schedule id (must be > 0)
          title: Schedule Id
        description: Schedule id (must be > 0)
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/intake_questionnaires/{questionnaire_id}/submit:
    put:
      tags:
      - intake_questionnaires
      summary: Submit Intake Questionnaire
      description: Validate a completed intake questionnaire and mark it submitted.
      operationId: submit_intake_questionnaire_api_v1_intake_questionnaires__questionnaire_id__submit_put
      security:
      - HTTPBearer: []
      parameters:
      - name: questionnaire_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Intake questionnaire id (must be > 0)
          title: Questionnaire Id
        description: Intake questionnaire id (must be > 0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeQuestionnaireSubmitRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeQuestionnaireResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
