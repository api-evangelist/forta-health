openapi: 3.2.0
info:
  title: Fast Evv API
  version: 0.1.0
tags:
- name: evv
paths:
  /api/v1/evv/capture_gps:
    post:
      tags:
      - evv
      summary: Capture Evv Gps
      operationId: capture_evv_gps_api_v1_evv_capture_gps_post
      parameters:
      - name: X-EVV-Token
        in: header
        required: true
        schema:
          type: string
          title: X-Evv-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EVVCaptureGpsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EVVCaptureGpsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    EVVCaptureGpsResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: EVVCaptureGpsResponse
    EVVCaptureGpsRequest:
      properties:
        lat:
          type: number
          title: Lat
        long:
          type: number
          title: Long
        accuracy_meters:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Accuracy Meters
        device_info:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Device Info
      type: object
      required:
      - lat
      - long
      title: EVVCaptureGpsRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
