    TreatmentSymptomsEnum:
      type: string
      enum:
      - Deficits in social-emotional reciprocity, ranging, for example, from abnormal social approach
        and failure of normal back- and- forth conversation; to reduced sharing of interests, emotions,
        or affect; to failure to initiate or respond to social interactions.
      - Deficits in nonverbal communicative behaviors used for social interaction, ranging, for example,
        from poorly integrated verbal and nonverbal communication; to abnormalities in eye contact and
        body language or deficits in understanding and use of gestures; to a total lack of facial expressions
        and nonverbal communication.
      - Deficits in developing, maintaining, and understanding relationships, ranging, for example, from
        difficulties adjusting behavior to suit various social contexts; to difficulties in sharing imaginative
        play or in making friends; to absences of interest in peers.
      - Stereotyped or repetitive motor movements, use of objects, or speech (e.g., simple motor stereotypies,
        lining up toys or flipping objects, echolalia, idiosyncratic phrases).
      - Insistence on sameness, inflexible adherence to routines, or ritualized patterns of verbal or
        nonverbal behavior (e.g. extreme distress at small changes, difficulties with transitions, rigid
        thinking patterns, greeting rituals, need to take same route or eat same food everyday).
      - Highly restricted, fixated interests that are abnormal in intensity or focus (e.g., strong attachment
        to or preoccupation with unusual objects, excessively circumscribed or preservative interest).
      - Hyper- or hyporeactivity to sensory input or unusual interest in sensory aspects of the environment
        (e.g., apparent indifference to pain/temperature, adverse response to specific sounds or textures,
        excessive smelling or touching of objects, visual fascination with lights or movement)
      title: TreatmentSymptomsEnum
