components:
  schemas:
    MedicalHistoryDiagnosisResponse:
      properties:
        diagnosis_name:
          type: string
          minLength: 10
          title: Diagnosis Name
        provider_name:
          type: string
          minLength: 2
          title: Provider Name
        year_diagnosis_made:
          type: integer
          title: Year Diagnosis Made
        city_diagnosis_made:
          type: string
          minLength: 2
          title: City Diagnosis Made
        state_diagnosis_made:
          $ref: '#/components/schemas/StateEnum'
        id:
          type: integer
          title: Id
      type: object
      required:
      - diagnosis_name
      - provider_name
      - year_diagnosis_made
      - city_diagnosis_made
      - state_diagnosis_made
      - id
      title: MedicalHistoryDiagnosisResponse
    TreatmentPlanMedicalHistoryVersionEnum:
      type: string
      enum:
      - v1
      - v2
      title: TreatmentPlanMedicalHistoryVersionEnum
    TreatmentPlanPatch:
      properties:
        client_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
        has_medication:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Medication
      type: object
      title: TreatmentPlanPatch
    DischargeReasonCreate:
      properties:
        label:
          $ref: '#/components/schemas/DischargeReasonEnum'
        description:
          anyOf:
          - type: string
            maxLength: 10000
            minLength: 2
          - type: 'null'
          title: Description
      type: object
      required:
      - label
      title: DischargeReasonCreate
    ProviderResponseWithoutAddress:
      properties:
        id:
          type: integer
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          type: string
          format: email
          title: Email
        status:
          type: string
          title: Status
        clinical_status:
          $ref: '#/components/schemas/ClinicalStatusEnum'
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      - status
