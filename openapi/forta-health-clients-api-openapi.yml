          - type: string
            pattern: ^[A-Za-z0-9]{2}$
          - type: 'null'
          title: Modifier 2
        modifier_3:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9]{2}$
          - type: 'null'
          title: Modifier 3
        modifier_4:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9]{2}$
          - type: 'null'
          title: Modifier 4
