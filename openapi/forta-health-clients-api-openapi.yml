openapi: 3.2.0
info:
  title: Fast Clients API
  version: 0.1.0
tags:
- name: clients
paths:
  /api/v1/clients/{client_id}/clinical_status/:
    put:
      tags:
      - clients
      summary: Set Clinical Status
      operationId: set_clinical_status_api_v1_clients__client_id__clinical_status__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientClinicalStatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/:
    post:
      tags:
      - clients
      summary: Create Client
      operationId: create_client_api_v1_clients__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - clients
      summary: Get All Clients
      operationId: get_all_clients_api_v1_clients__get
      security:
      - HTTPBearer: []
      parameters:
      - name: clinical_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          default:
          - CLINICAL
          title: Clinical Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientWithAddressListResponse'
                title: Response Get All Clients Api V1 Clients  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/{client_id}/:
    patch:
      tags:
      - clients
      summary: Patch Client
      operationId: patch_client_api_v1_clients__client_id___patch
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - clients
      summary: Get Client
      operationId: get_client_api_v1_clients__client_id___get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetailedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/families/:
    get:
      tags:
      - clients
      summary: Fetch Client Families
      operationId: fetch_client_families_api_v1_clients_families__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Id
      - name: date_active
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date Active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientFamilyListResponse'
                title: Response Fetch Client Families Api V1 Clients Families  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/{client_id}/reset_assessment_allocation/:
    put:
      tags:
      - clients
      summary: Reset Client Assessment Allocation
      operationId: reset_client_assessment_allocation_api_v1_clients__client_id__reset_assessment_allocation__put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAssessmentAllocationReset'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/{client_id}/modifier_matrix/:
    post:
      tags:
      - clients
      summary: Create Client Modifier Matrix Row
      operationId: create_client_modifier_matrix_row_api_v1_clients__client_id__modifier_matrix__post
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPayorModifierMatrixCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayorModifierMatrixResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - clients
      summary: Get Client Modifier Matrix Rows
      operationId: get_client_modifier_matrix_rows_api_v1_clients__client_id__modifier_matrix__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientPayorModifierMatrixResponse'
                title: Response Get Client Modifier Matrix Rows Api V1 Clients  Client Id  Modifier Matrix  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clients/{client_id}/modifier_matrix/{modifier_matrix_id}/:
    put:
      tags:
      - clients
      summary: Replace Client Modifier Matrix Row
      operationId: replace_client_modifier_matrix_row_api_v1_clients__client_id__modifier_matrix__modifier_matrix_id___put
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      - name: modifier_matrix_id
        in: path
        required: true
        schema:
          type: integer
          title: Modifier Matrix Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPayorModifierMatrixCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayorModifierMatrixResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - clients
      summary: Delete Client Modifier Matrix Row
      operationId: delete_client_modifier_matrix_row_api_v1_clients__client_id__modifier_matrix__modifier_matrix_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: integer
          title: Client Id
      - name: modifier_matrix_id
        in: path
        required: true
        schema:
          type: integer
          title: Modifier Matrix Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ProviderResponseWithoutAddress:
      properties:
        id:
          type: integer
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          type: string
          format: email
          title: Email
        status:
          type: string
          title: Status
